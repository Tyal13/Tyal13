name: Refresh Streak SVG

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch streak SVG
        run: |
          mkdir -p profile
          curl -sfL 'https://streak-stats.demolab.com?user=Tyal13&theme=transparent&hide_border=true&border_radius=8&stroke=00ff88&ring=00ff88&fire=00ff88&currStreakLabel=00ff88' \
            -o profile/streak.svg.candidate

      - name: Validate candidate and swap in
        run: |
          # Reject the streak-stats fallback SVG ("Failed to retrieve contributions...")
          # so a bad API day never clobbers a good SVG.
          if grep -q "Failed to retrieve" profile/streak.svg.candidate; then
            echo "streak-stats returned the error fallback; keeping the previous SVG."
            rm -f profile/streak.svg.candidate
            exit 0
          fi
          # A healthy SVG contains the counter labels rendered around real numbers.
          if ! grep -q "Total Contributions" profile/streak.svg.candidate; then
            echo "candidate does not look like a streak SVG; keeping the previous one."
            rm -f profile/streak.svg.candidate
            exit 0
          fi
          mv profile/streak.svg.candidate profile/streak.svg

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain profile/streak.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add profile/streak.svg
            git commit -m "chore: refresh streak SVG"
            git push
          else
            echo "No streak changes."
          fi

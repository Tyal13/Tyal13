name: Refresh Streak SVG

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch streak SVG
        run: |
          mkdir -p profile
          curl -sfL 'https://streak-stats.demolab.com?user=Tyal13&theme=transparent&hide_border=true&border_radius=8&stroke=00ff88&ring=00ff88&fire=00ff88&currStreakLabel=00ff88' \
            -o profile/streak.svg

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain profile/streak.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add profile/streak.svg
            git commit -m "chore: refresh streak SVG"
            git push
          else
            echo "No streak changes."
          fi
